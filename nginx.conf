server {
    listen 80;
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Permitir carga de expedientes documentales e imágenes de alta resolución
    client_max_body_size 50M;

    # Compresión Gzip para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Soporte para Single Page Application (SPA React Router): /login, /recuperar,
    # /restablecer?token=..., /plataforma, /admin, /portal, etc. caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # index.html nunca se cachea: así cada despliegue carga el bundle nuevo
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service worker de la app instalable: nunca en caché, para que cada despliegue lo actualice
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Caché optimizada para assets estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Desactivar logs de robots y favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
